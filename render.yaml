# Один сервис на Render: backend (API) + собранный frontend на одном адресе.
# Сайт:   https://<имя>.onrender.com/
# API:    https://<имя>.onrender.com/api/health
services:
  - type: web
    name: warntech
    runtime: node
    plan: free
    # rootDir не указываем — работаем из корня репозитория
    buildCommand: npm install --include=dev --prefix frontend && npm run build --prefix frontend && npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false        # строка подключения из MongoDB Atlas
