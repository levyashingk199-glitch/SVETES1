# Внешний пинг: будит и не даёт уснуть backend на бесплатном хостинге.
# Настройка: GitHub → Settings → Secrets and variables → Actions → Variables
#   API_URL = https://ВАШ-BACKEND.onrender.com   (без /api на конце)
name: Keep API online

on:
  schedule:
    - cron: '*/10 * * * *'   # каждые 10 минут (GitHub может запускать с задержкой)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "Переменная API_URL не задана"; exit 1; fi
          # Холодный старт на free-тарифе может занимать до ~60 секунд
          curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "${API_URL%/}/api/health"
